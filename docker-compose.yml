name: la-gazette

x-gazette-env: &gazette-env
  GAZETTE_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

x-airflow: &airflow
  image: la-gazette-airflow:dev
  pull_policy: never
  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped
  environment: &airflow-env
    <<: *gazette-env
    GAZETTE_SOURCES: /opt/gazette/sources.csv
    GAZETTE_ARTICLES_BRUTS: /opt/gazette/data/articles_bruts
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./data:/opt/gazette/data
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  airflow-init:
    <<: *airflow
    build:
      context: .
      target: airflow
    pull_policy: build
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python - <<'EOF'
        import os, psycopg
        with psycopg.connect(os.environ["GAZETTE_DSN"], autocommit=True) as c:
            if not c.execute("SELECT 1 FROM pg_database WHERE datname = 'airflow'").fetchone():
                c.execute("CREATE DATABASE airflow")
        EOF
        airflow db migrate
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor

  collecte:
    profiles: [outils]
    build:
      context: .
      target: runtime
    image: la-gazette:dev
    environment:
      <<: *gazette-env
      GAZETTE_ARTICLES_BRUTS: /app/data/articles_bruts
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    image: la-gazette:test
    environment:
      GAZETTE_DSN_TEST: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  airflow-logs:
